services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: miso-blog-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - miso-blog-network

networks:
  miso-blog-network:
    name: ${MISO_BLOG_NETWORK_NAME:-miso-blog-network}
