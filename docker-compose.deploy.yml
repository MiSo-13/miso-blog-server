services:
  miso-blog-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8010
      BLOG_PUBLIC_BASE_URL: ${BLOG_PUBLIC_BASE_URL:-http://localhost:8010}
      BLOG_MEDIA_UPLOAD_DIR: ${BLOG_MEDIA_UPLOAD_DIR:-/data/miso-blog/uploads}
      BLOG_MEDIA_PUBLIC_URL_PREFIX: ${BLOG_MEDIA_PUBLIC_URL_PREFIX:-/media}
      BLOG_MEDIA_MAX_FILE_SIZE: ${BLOG_MEDIA_MAX_FILE_SIZE:-10MB}
      BLOG_MEDIA_MAX_REQUEST_SIZE: ${BLOG_MEDIA_MAX_REQUEST_SIZE:-30MB}
      BLOG_MEDIA_MAX_FILE_SIZE_BYTES: ${BLOG_MEDIA_MAX_FILE_SIZE_BYTES:-10485760}
      BLOG_LOCAL_REPOSITORY_CLONE_BASE_DIR: ${BLOG_LOCAL_REPOSITORY_CLONE_BASE_DIR:-/data/miso-blog/repositories}
      JAVA_OPTS: ${MISO_BLOG_JAVA_OPTS:-}
    ports:
      - "${MISO_BLOG_PORT:-8010}:8010"
    volumes:
      - ${MISO_BLOG_UPLOAD_ROOT:-/srv/miso-blog/uploads}:/data/miso-blog/uploads
      - ${MISO_BLOG_REPOSITORIES_ROOT:-/srv/miso-blog/repositories}:/data/miso-blog/repositories
      # Docker 배포에서 로컬 repo 분석이 필요하면 application-private.yml의 경로를 /data/local-projects/... 로 맞춥니다.
      - ${MISO_BLOG_LOCAL_PROJECTS_ROOT:-C:/pjt}:/data/local-projects:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - miso-blog-network

networks:
  miso-blog-network:
    name: ${MISO_BLOG_NETWORK_NAME:-miso-blog-network}
