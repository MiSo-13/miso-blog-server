spring:
  application:
    name: miso-blog-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    include: private
  servlet:
    multipart:
      max-file-size: ${BLOG_MEDIA_MAX_FILE_SIZE:10MB}
      max-request-size: ${BLOG_MEDIA_MAX_REQUEST_SIZE:30MB}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: ${SERVER_PORT:8010}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

blog:
  ai:
    provider: openai
    api-key: ${OPENAI_API_KEY:${openai.api-key:}}
    admin-key: ${OPENAI_ADMIN_KEY:${openai.admin-key:${openai.api-key:}}}
    model: ${OPENAI_MODEL:${openai.model:gpt-4.1-mini}}
    budget-limit-usd: ${OPENAI_BUDGET_LIMIT_USD:${openai.budget-limit-usd:}}
  github:
    token: ${GITHUB_TOKEN:${github.token:}}
    owner: ${GITHUB_OWNER:${github.owner:}}
    pages-repository-name: ${GITHUB_PAGES_REPOSITORY_NAME:${github.pages-repository-name:}}
    pages-repository-full-name: ${GITHUB_PAGES_REPOSITORY_FULL_NAME:${github.pages-repository-full-name:}}
    pages-branch: ${GITHUB_PAGES_BRANCH:${github.pages-branch:main}}
    pages-content-root-path: ${GITHUB_PAGES_CONTENT_ROOT_PATH:${github.pages-content-root-path:_posts}}
    pages-base-url: ${GITHUB_PAGES_BASE_URL:${github.pages-base-url:}}
    pages-custom-domain: ${GITHUB_PAGES_CUSTOM_DOMAIN:${github.pages-custom-domain:}}
  local-repositories:
    defaults: []
  publish:
    base-url: ${BLOG_PUBLIC_BASE_URL:http://localhost:8010}
  media:
    upload-dir: ${BLOG_MEDIA_UPLOAD_DIR:uploads/blog-media}
    public-url-prefix: ${BLOG_MEDIA_PUBLIC_URL_PREFIX:/media}
    max-file-size-bytes: ${BLOG_MEDIA_MAX_FILE_SIZE_BYTES:10485760}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:${db.url}}
    username: ${DB_USERNAME:${db.username}}
    password: ${DB_PASSWORD:${db.password}}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
